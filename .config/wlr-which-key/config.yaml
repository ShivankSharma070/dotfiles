# Theming
font: JetBrainsMono Nerd Font 12
background: "#282828d0"
color: "#fbf1c7"
border: "#8ec07c"
separator: " ➜ "
border_width: 2
corner_r: 10
padding: 15 # Defaults to corner_r
rows_per_column: 5 # No limit by default
# column_padding: 25 # Defaults to padding

# Anchor and margin
anchor: bottom-right # One of center, left, right, top, bottom, bottom-left, top-left, etc.
# Only relevant when anchor is not center
margin_right: 0
margin_bottom: 0
margin_left: 0
margin_top: 0

# namespace to use for the layer shell surface
# namespace: "wlr_which_key"

# Permits key bindings that conflict with compositor key bindings.
# Default is `false`.
inhibit_compositor_keyboard_shortcuts: true

# Try to guess the correct keyboard layout to use. Default is `false`.
auto_kbd_layout: true

menu:
  - key: "r"
    desc: rofi
    submenu:
      - key: "r"
        desc: App Launcher
        cmd: launcher_app.sh
      - key: "w"
        desc: Windows
        cmd: /home/shivank/.config/rofi/scripts/launcher_t4
      - key: "f"
        desc: File launcher 
        cmd: launcher_file.sh
      - key: "s"
        desc: Screenshot
        cmd: /home/shivank/.config/rofi/applets/bin/screenshot.sh
  - key: "e"
    desc: Editor
    submenu:
      - key: "e"
        desc: Zed
        cmd: zeditor
      - key: "f"
        desc: Neovide Launcher
        cmd: neovide_launcher.sh
