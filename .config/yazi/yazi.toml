
[mgr]
# "natural" sorts: 1 < 2 < 10. Default "alphabetical" does 1 < 10 < 2.
sort_by        = "natural"
# Show file size on the right. Switch to "mtime" or "permissions" as needed.
linemode       = "size"
# Scrolloff of 8 feels good; set to 200+ to always center cursor.
scrolloff      = 8

[preview]
# Better quality than default "triangle". Use "lanczos3" if you don't mind CPU.
image_filter   = "catmull-rom"
image_quality  = 85
# 2-space tabs look better for code preview
tab_size       = 2

# ─────────────────────────────────────────────
# OPENERS — define named launchers used in [open]
# ─────────────────────────────────────────────

[opener]

# Text / code
edit = [
  { run = "nvim %s",    desc = "nvim",    for = "unix", block = true },
  { run = "zeditor %s",     desc = "zed",     for = "unix", orphan = true },
  { run = "neovide %s", desc = "neovide", for = "unix", orphan = true },
]

# Directories — opened from within yazi (e.g. via shell rule)
reveal = [
  { run = "nvim %s",          desc = "nvim (as dir)",  for = "unix", block = true },
  { run = "zeditor %s",           desc = "zed",            for = "unix", orphan = true },
  { run = "nautilus %s",      desc = "nautilus",       for = "unix", orphan = true },
]

# Video
play = [
  { run = "mpv %s",           desc = "mpv",    for = "unix", orphan = true },
  { run = "vlc %s",           desc = "vlc",    for = "unix", orphan = true },
]

# Audio
listen = [
  { run = "vlc %s",           desc = "vlc",    for = "unix", orphan = true },
  { run = "mpv %s",           desc = "mpv",    for = "unix", orphan = true },
]

# Image
view = [
  { run = "sixv %s",          desc = "sixv (terminal)", for = "unix", block = true },
  { run = "nomacs %s",        desc = "nomacs",          for = "unix", orphan = true },
  { run = "gimp %s",          desc = "gimp",            for = "unix", orphan = true },
]

# PDF
read = [
  { run = "okular %s",        desc = "okular",     for = "unix", orphan = true },
  { run = "$BROWSER %s",      desc = "browser",    for = "unix", orphan = true },
]

# Office docs (docx, xlsx, pptx, odt, etc.)
office = [
  { run = "onlyoffice-desktopeditors %s", desc = "OnlyOffice",  for = "unix", orphan = true },
  { run = "libreoffice %s",              desc = "LibreOffice",  for = "unix", orphan = true },
]

# Fallback
open = [
  { run = "xdg-open %s",  desc = "xdg-open", for = "unix", orphan = true },
  { run = "nautilus %s",  desc = "reveal in nautilus", for = "unix", orphan = true },
]

# ─────────────────────────────────────────────
# OPEN RULES — what opener applies to what file
# First match wins. Use prepend_rules to stay additive over defaults.
# ─────────────────────────────────────────────

[open]
rules = [
  # Directories
{ url = "*/", use = [ "reveal", "open" ] },

  # Text / code
  { mime = "text/*",                                       use = [ "edit", "open" ] },
  { mime = "application/{json,ndjson}",                   use = [ "edit", "open" ] },
  { mime = "*/javascript",                                 use = [ "edit", "open" ] },
  { mime = "inode/empty",                                  use = [ "edit", "open" ] },

  # Image
  { mime = "image/*",                                      use = [ "view", "open" ] },

  # Video
  { mime = "video/*",                                      use = [ "play", "open" ] },

  # Audio
  { mime = "audio/*",                                      use = [ "listen", "open" ] },

  # PDF
  { mime = "application/pdf",                              use = [ "read", "open" ] },

  # Office documents
  { mime = "application/{msword,vnd.ms-excel,vnd.ms-powerpoint}", use = [ "office", "open" ] },
  { mime = "application/openxmlformats-officedocument.*",     use = [ "office", "open" ] },
  { mime = "application/vnd.oasis.opendocument.*",                use = [ "office", "open" ] },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
  { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}",             use = [ "extract", "reveal" ] },

  # Virtual filesystem (remote/stale)
  { mime = "vfs/{absent,stale}", use = "download" },

  # Fallback
  { url = "*", use = [ "open", "reveal" ] },
]

# ─────────────────────────────────────────────
# TASKS — tweak only if you're doing heavy async work
# ─────────────────────────────────────────────

[tasks]
# Suppress preload spinner from the task list (cleaner UI)
suppress_preload = true

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
