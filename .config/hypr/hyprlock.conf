source = $HOME/.cache/wal/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    fade_in_time = 1000
    fade_out_time = 600
}

background {
    monitor =
    path = cmd[update:1000] swww query | awk -F'image: ' '{print $2}'
    blur_size = 8
    blur_passes = 4
    noise = 0.0060
    contrast = 0.8500
    brightness = 0.5500
    vibrancy = 0.1200
    vibrancy_darkness = 0.3
}

}

# ── Hours ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 0.96)
    font_size = 86
    font_family = Geist Mono, monospace
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.40)
    position = 0, 148
    halign = center
    valign = center
}

# ── Minutes ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 0.50)
    font_size = 86
    font_family = Geist Mono, monospace
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.40)
    position = 0, 48
    halign = center
    valign = center
}

# ── Divider ───────────────────────────────────────────────────────────────────
shape {
    monitor =
    size = 180, 1
    color = rgba(255, 255, 255, 0.10)
    rounding = 0
    position = 0, -18
    halign = center
    valign = center
}

# ── Day of week ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A')"
    color = rgba(255, 255, 255, 0.70)
    font_size = 15
    font_family = Geist, sans-serif
    position = 0, -34
    halign = center
    valign = center
}

# ── Full date ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%B %-d, %Y')"
    color = rgba(255, 255, 255, 0.38)
    font_size = 12
    font_family = Geist, sans-serif
    position = 0, -56
    halign = center
    valign = center
}

# ── Weather ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1800000] echo "$(curl -s 'wttr.in/agra?format=%c+%t' | tr -d '+')"
    color = rgba(255, 255, 255, 0.30)
    font_size = 12
    font_family = Geist, sans-serif
    position = 0, -76
    halign = center
    valign = center
}

# ── Password input ────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 220, 42
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.50
    dots_center = true
    dots_rounding = 10
    rounding = 21
    outer_color = rgba(0, 0, 0, 0.00)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgba(255, 255, 255, 0.85)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##ffffff45" font_style="italic" font_size="12">Password</span>
    check_color = rgba(140, 210, 255, 0.85)
    fail_color = rgba(255, 90, 90, 0.85)
    fail_text = <span foreground="##ff5a5a" font_size="11">Try again</span>
    fail_timeout = 2000
    position = 0, -148
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.25)
}

# ── Lock hint ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text =   Locked
    color = rgba(255, 255, 255, 0.18)
    font_size = 10
    font_family = Geist, sans-serif
    position = 0, -188
    halign = center
    valign = center
}
