gesture = 3, up, dispatcher,workspace, +1
gesture = 3, down, dispatcher,workspace, -1
gesture = 3, right,dispatcher,  layoutmsg, move -col
gesture = 3, left,dispatcher,  layoutmsg, move +col
gesture = 3, pinch,close
gesture = 4, left, dispatcher, exec, $fileManager
gesture = 4, right, dispatcher, exec, obsidian
gesture = 4, down, dispatcher, exec, $terminal
gesture = 4, up, dispatcher, exec, $browser


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, W, exec, killall -SIGUSR1 waybar # Toggle hide/show waybar
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, $alternate_browser
bind = $mainMod, SPACE, exec, pkill rofi || /home/shivank/.config/rofi/scripts/launcher_t2
bind = $mainMod SHIFT, Return, exec, pkill rofi || search_launcher.sh
# bind = $mainMod SHIFT, Return, exec, wofi --show run
bind = $mainMod CTRL, Return, exec, $terminal -e yazi &
bind = $mainMod SHIFT, C, killactive,
# bind = $mainMod , N, exec, swaync-client -t -sw

# bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, Q, exec, wlogout -C /home/shivank/.config/wlogout/nova.css
bind = $mainMod , F11, exec, gamemode.sh
bind = $mainMod , F12, exec, randomiseWallpaper.sh

bind = $mainMod, P, pin
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, pseudo, # dwindle
bind = $mainMod, T, togglesplit, # dwindle


######################################################################################
#            CHANGE THIS SECTION FOR ENABLING/DISABLING HYPRSCROLLING
bind = $mainMod, F , fullscreen, 1
bind = $mainMod, C ,layoutmsg ,colresize +conf
bind = $mainMod, O ,exec , togglefit.sh
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod CTRL, F, fullscreenstate, 0 2
bind = $mainMod ,equal, layoutmsg ,colresize +0.05
bind = $mainMod ,minus,layoutmsg ,colresize -0.05

# Move focus with SUPER + h/j/k/l
# toggle these when not using scrolling layout
bind = $mainMod, L, layoutmsg, move +col
bind = $mainMod, H, layoutmsg, move -col

# bind = $mainMod, H, movefocus, l
# bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, TAB, cyclenext

# Move window around the stack with SUPER + SHIFT + h/j/k/l
# for hyprscrolling
bind = $mainMod CTRL, L, layoutmsg, swapcol r
bind = $mainMod CTRL, H, layoutmsg, swapcol l
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
######################################################################################

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, Y, workspace, 1
# bind = $mainMod, U, workspace, 2
# bind = $mainMod, I, workspace, 3
# bind = $mainMod, O, workspace, 4
# bind = $mainMod, P, workspace, 5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, bracketleft, workspace , -1 # brackets [ or ]
bind = $mainMod, bracketright, workspace , +1
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, bracketleft, movetoworkspace, -1 # brackets [ or ]
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1
# Move active window to a workspace silently mainMod + CTRL [0-9]
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1 # brackets [ or ]
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1


# Example special workspace (scratchpad)
bind = $mainMod, X, togglespecialworkspace, firstmagic
bind = $mainMod, Z, togglespecialworkspace, secondmagic
bind = $mainMod SHIFT, X, movetoworkspacesilent, special:firstmagic
bind = $mainMod SHIFT, Z, movetoworkspacesilent, special:secondmagic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, R, exec, wlr-which-key -k r
bind = $mainMod, E, exec, wlr-which-key -k e
