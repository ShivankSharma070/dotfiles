# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel = ,XF86Explorer, exec, $fileManager
bindel = ,XF86Search, exec, search_launcher.sh
bindel = ,XF86Mail, exec, $browser https://mail.google.com/
bindel = ,XF86HomePage, exec, min-browser
bindel = ,XF86Calculator, exec, qalculate-gtk
bindel = ,XF86Tools, exec, spotify
bindel = ,print, exec, hyprshot -m region -o ~/Pictures/Screenshots

# Requires playerctl
bindl = , XF86AudioPause, exec, play_pause.sh
bindl = , pause , exec, play_pause.sh
bindl = , XF86AudioPlay, exec, play_pause.sh
bindl = , XF86AudioPrev, exec, prev_next.sh prev
bindl = , XF86AudioNext, exec, prev_next.sh next
bindel = ,XF86AudioStop, exec, playerctl stop

# Zoom
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')

