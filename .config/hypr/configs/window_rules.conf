# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
#Opacity for all windows
windowrule = opacity 1, suppress_event maximize, match:class .*
windowrule = opacity 1, match:class vlc
windowrule = opacity 1, match:title Fake-Lock-Screen
windowrule = opacity 1, match:class mpv
windowrule = opacity 1, match:class org.kde.okular
windowrule = opacity 1, match:title ^(.*YouTube.*)$
# windowrulev2 = opacity 1,title:^(.*Obsidian.*)$
windowrule = opacity 1, match:title ^(.*HiMovies.*)$
windowrule = opacity 1, match:class com.obsproject.Studio
#Some settings for emacs
windowrule = opacity 0.95, match:class neovide

windowrule = float on, match:title Qalculate!
windowrule = float on, match:class Electron

#Conky 
windowrule = float on, border_size 0, match:class (?i)conky

# make terminal fully opaque 
windowrule = opacity 1, match:class com.mitchellh.ghostty
windowrule = opacity 1, match:class kitty
windowrule = opacity 1, match:class foot

windowrule = float on, match:class ^(tasty.javafx.launcher.LauncherFxApp)$, match:title ^(tastytrade)$
windowrule = float on, match:class ^(tasty.javafx.launcher.LauncherFxApp)$, match:title ^(tastycharts)$
windowrule = float on, match:class ^(tasty.javafx.launcher.LauncherFxApp)$, match:title ^(tastytrade - Portfolio Report)$
windowrule = float on, match:class ^(tasty.javafx.launcher.LauncherFxApp)$, match:title ^(Dashboard)$
# windowrulev2 = bordercolor $bordercolor2,floating:1
# windowrule = border_color $bordercolor2 $bordercolor2, match:pin 1


# Ignore maximize requests from apps. You'll probably like this.

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0


