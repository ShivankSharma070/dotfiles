
windowrule = idle_inhibit fullscreen, opacity 1, match:fullscreen 1

# Picture-in-a-Picture (PIP) rules: Oddly, some need re-duplication.  This is because the window for
# PIP changes after on first launch, and will not inherant the rules...
windowrule = opacity 1, match:title ^(Picture-in-Picture)$ # for opacity: [focus num] [bg num]
# Interestingly, the opacity rule above doesn't need the reduplication?
windowrule = pin on, float on, size (monitor_w*0.25) (monitor_h*0.25), move ((monitor_w*0.72)) ((monitor_h*0.07)), match:title ^(Picture-in-Picture)$

