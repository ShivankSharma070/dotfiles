# Example of how you can set window rules.
# This rule is for noborders and no rounded corners on workspace 4.
# // Causing error in recent update
# workspace = 4, gapsout:0, gapsin:0, border: 0, rounding:0

#making waybar blur
layerrule = blur on, ignore_alpha 0, match:namespace waybar

#For sway control centre
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-notification-window


