# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,period,reload_config

# most used application and scripts
bind=SUPER,space,spawn, /home/shivank/.config/rofi/scripts/launcher_t2
bind=SUPER+SHIFT,Return,spawn, search_launcher.sh
bind=SUPER,Return,spawn,kitty
bind=SUPER,B,spawn,zen-browser
bind=SUPER+SHIFT,C,killclient,
bind=SUPER,W,spawn, killall -SIGUSR1 waybar 
bind=SUPER,F12,spawn, randomiseWallpaper.sh

#submenus
bind=SUPER,R, spawn, wlr-which-key -k r
bind=SUPER,E, spawn, wlr-which-key -k e

# wlogout
bind=SUPER+SHIFT,q,spawn ,wlogout -C /home/shivank/.config/wlogout/nova.css
bind=SUPER,q,quit

# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# swap window
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+CTRL,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# Gesturebind
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
gesturebind=none,up,3,viewtoleft
gesturebind=none,up, 3,viewtoright
gesturebind=none,down,4,toggleoverview,1
# gesturebind=none,down,4,spawn, zen-browser

# scroller layout
bind=SUPER,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER,=,resizewin,+0,-50
bind=SUPER,_,resizewin,+0,+50
bind=SUPER,-,resizewin,-50,+0
bind=SUPER,PLUS,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Audio
bind=none,XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Playerctl 
bind=none,XF86AudioNext, spawn, prev_next.sh next
bind=none,XF86AudioPause, spawn, play_pause.sh
bind=none,XF86AudioPlay, spawn, play_pause.sh
bind=none,XF86AudioPrev, spawn, prev_next.sh prev
bind=none,XF86AudioStop, spawn, playerctl stop

# Brightness
bind=none,XF86MonBrightnessUp, spawn, brightnessctl s 10%+
bind=none,XF86MonBrightnessDown, spawn, brightnessctl s 10%-

bind=none,XF86Explorer, spawn, nautilus
